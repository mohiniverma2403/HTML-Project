<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Akronim&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        .bn{
            background-color:rgb(45, 122, 174);
            height: 10vh;
            display: flex;
            justify-content: left;
            align-items: center;
            font-size: 2em;
            padding-left: 2em;
            font-family: Akronim;
        }
        .bn1{
            background-color: azure;
            height: 90vh;
            display: flex;
            justify-content: left;
            align-items: center;
            padding-left: 3em;
            font-size: xxx-large;
            font-family: 'Courier New', Courier, monospace;
        }
        .ha{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 9em;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        .ha:hover{
            background-color: lightblue;
            transition: 1s;
        }
        .ha1{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 16em;
        }
        span{
            padding-left: 1.5em;
        }
        .i{
            padding-left: 0.5em;
            font-size: 35px;
        }
        .hn{
            height: 13em;
            width: 8em;
            border: 3px solid black;
            border-radius: 30px;
            font-family: 'Akronim';
            margin-left: 5em;
            background-color: navy;
        }
        .profile-img {
        width: 3em;
        height: 3em;
        border-radius: 50%;
        border: 2px solid #66a6ff;
        margin-left: 2.5em;
        margin-top: 0.5em;
        }
        .hn1{
            font-size: 30px; 
            color: lightskyblue;
            padding-top:0em;
            margin-left: 4em;
        }
        .img{
        width: 1.5em;
        height: 1.5em;
        border-radius: 50%;
        border: 2px solid #66a6ff;
        
        }
    </style>
</head>
<body>
    <div class="bn">
            <img src="/IMG-20250921-WA0013.jpg" alt="Profile Picture" class="img">Mohini Verma
            <div class="ha">
                <b><span>Home</span>
                <span>About</span>
                <span>Skills</span>
                <span>Portfolio</span>
                <span>Contact</span></b>
                <div class="ha1">
                    <div class="i"><i class="fa-brands fa-linkedin fa-fade" style="color: #050505;"></i></div>
                    <div class="i"><i class="fa-brands fa-github fa-flip" style="color: #000000;"></i></div>
                    <div class="i"><i class="fa-brands fa-square-behance fa-shake" style="color: #000000;"></i></div>
                </div>
            </div>            
    </div>
    <div class="bn1">
        <h1>RESPONSIVE <br>
        <div style="color: lightskyblue;">NAVIGATION</div> 
            BAR
        </h1>
        <div class="hn">
            <img src="/IMG-20250921-WA0013.jpg" alt="Profile Picture" class="profile-img">
            <div class="hn1">
            MohiniVerma
            </div>
        </div>
    </div>
</body>
</html>
